name: brain_storm
description: "🧠 Ежедневная тренировка мышления. Развивай креативность, логику, социальный интеллект и скорость принятия решений."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  get_it: ^7.6.0
  shared_preferences: ^2.2.0
  connectivity_plus: ^5.0.0
  flutter_bloc: ^8.1.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  json_annotation: ^4.8.0
  freezed_annotation: ^2.4.1
  intl: ^0.18.0
  logger: ^2.0.0
  flutter_svg: ^2.0.0
  google_fonts: ^6.1.0
  fl_chart: ^0.63.0
  lottie: ^3.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  freezed: ^2.4.1
  cupertino_icons: ^1.0.8

flutter:
  assets:
    - assets/data/tasks.json
  uses-material-design: true